---
# Example: turn NUCs in the [test_sources] inventory group into TL
# commissioning test source appliances.
#
#   ansible-playbook -i inventory.ini ansible/playbook-example.yml
#
# Inventory example (inventory.ini):
#   [test_sources]
#   tl-source-01 ansible_host=192.168.1.50 ansible_user=installer
#
# Build the deb first: ./packaging/build-deb.sh  (on a matching Ubuntu 24.04)

- hosts: test_sources
  become: true
  roles:
    - role: tl_commissioning_source
      vars:
        tl_deb_src: "{{ playbook_dir }}/../dist/tl-commissioning-source_0.1.21_amd64.deb"
        tl_appliance_id: "TL-TESTSOURCE-{{ '%02d' | format(play_hosts.index(inventory_hostname) + 1) }}"
        tl_source_number: "{{ play_hosts.index(inventory_hostname) + 1 }}"
        tl_company: "Transition Layer"
        tl_pin: "{{ vault_tl_pin }}"              # keep secrets in ansible-vault
        # MUST match the token stored in the OpenAVC snapshot's TL device,
        # or the restored panel cannot control the appliance.
        tl_api_token: "{{ vault_tl_api_token }}"
        tl_panel_url: "http://{ip}:8080/panel"    # literal {ip}: resolved on-appliance
        tl_kiosk_user: kiosk
        tl_reboot: false                          # reboot after OpenAVC below

    # Full room-control replica: OpenAVC + the captured project (devices,
    # TL driver, panel UI, room script, Programmer password). Capture on
    # the reference machine:
    #   sudo systemctl stop openavc
    #   sudo tar czf openavc-state.tgz -C /var/lib openavc
    #   sudo systemctl start openavc
    - role: openavc_room_control
      vars:
        openavc_state_src: "{{ playbook_dir }}/openavc-state.tgz"

  post_tasks:
    - name: Reboot into the kiosk
      ansible.builtin.reboot:
        reboot_timeout: 300
