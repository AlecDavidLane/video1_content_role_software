---
- name: restart feedback-kiosk app
  ansible.builtin.systemd:
    name: feedback-kiosk
    state: restarted
    daemon_reload: true

- name: dconf update
  ansible.builtin.command: dconf update
  changed_when: true

- name: reload kiosk browser
  # The kiosk session unit has Restart=always: killing the browser
  # relaunches it in ~2s onto the new profile (pages are served
  # no-cache by Next in dev and versioned in prod; a fresh launch always
  # shows the new branding). Tolerant when no browser is running yet.
  ansible.builtin.command: pkill -f fk-kiosk-profile
  register: fk_pkill
  changed_when: fk_pkill.rc == 0
  failed_when: false
