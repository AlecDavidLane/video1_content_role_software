# Transition Layer commissioning test source — sample configuration.
# Installed to /etc/tl-commissioning-source/config.yaml.
# Schema: packaging/config.schema.json (also shipped inside the package).
# Contains no secrets except the PIN hash, which is written by
# `tl-source init --pin ...` or first-run setup and never exported.

appliance:
  id: TL-TESTSOURCE-01
  friendly_name: Transition Layer Test Source
  source_number: 1

branding:
  company_name: Transition Layer
  logo_path: ""              # absolute path to PNG/JPEG/SVG; empty = placeholder
  accent_colour: "#00d4aa"
  report_footer: Commissioning record generated by the Transition Layer test source.

engineer:
  default_name: ""

server:
  bind_host: 0.0.0.0          # bind to LAN so a phone can reach the UI (NFR-09:
                              # restrict to a specific interface address if required)
  port: 8808
  external_url: ""            # optional override for the QR code target

security:
  token_ttl_seconds: 43200
  # pin_hash / pin_salt / setup_complete are managed by the application.

output:
  preferred_connector: ""     # e.g. HDMI-1; empty = first connected output
  default_mode: ""            # e.g. 1920x1080@60; empty = leave current mode

audio:
  preferred_sink: ""          # pactl sink name; empty = first HDMI sink

soak:
  default_minutes: 30
  audio_enabled: true

storage:
  data_dir: /var/lib/tl-commissioning-source
  reports_dir: /var/lib/tl-commissioning-source/reports
  evidence_dir: /var/lib/tl-commissioning-source/evidence
  low_disk_warn_mb: 1024
  max_photo_mb: 25
  report_retention_days: 0    # 0 = keep forever

report:
  chromium_path: ""           # empty = autodetect chromium/chromium-browser

hardware:
  display_backend: auto       # auto | xrandr | mock
  audio_backend: auto         # auto | pactl | mock
